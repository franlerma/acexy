name: Create and publish the Docker images
on:
    release:
        types: [published]

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}
    DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/acexy
    GHCR_ENGINE_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/acestream-vpn-switch
    DOCKERHUB_ENGINE_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/acestream-vpn-switch

jobs:
    build-and-push-image:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
            attestations: write
            id-token: write
        steps:
            - name: Check out the repository
              uses: actions/checkout@v4

            - name: Log in to the Container registry
              uses: docker/login-action@v3
              with:
                registry: ${{ env.REGISTRY }}
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            # Tags para la imagen del orquestador (acexy). Mismo evento de
            # release => mismo tag que el motor => versionado coordinado.
            - name: Extract metadata (tags, labels) for acexy
              id: meta
              uses: docker/metadata-action@v5
              with:
                images: |
                  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  ${{ env.DOCKERHUB_IMAGE }}
                flavor: |
                  latest=${{ !github.event.release.prerelease }}

            - name: Extract metadata (tags, labels) for the engine
              id: meta-engine
              uses: docker/metadata-action@v5
              with:
                images: |
                  ${{ env.GHCR_ENGINE_IMAGE }}
                  ${{ env.DOCKERHUB_ENGINE_IMAGE }}
                flavor: |
                  latest=${{ !github.event.release.prerelease }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # Capa 1: orquestador acexy (raíz del repo)
            - name: Build and push acexy
              id: push
              uses: docker/build-push-action@v6
              with:
                context: .
                platforms: linux/amd64,linux/arm64,linux/arm/v7
                push: true
                tags: ${{ steps.meta.outputs.tags }}
                labels: ${{ steps.meta.outputs.labels }}

            # Capa 2: motor acestream-vpn-switch (subdirectorio engine/)
            - name: Build and push the engine (acestream-vpn-switch)
              id: push-engine
              uses: docker/build-push-action@v6
              with:
                context: ./engine
                file: ./engine/Dockerfile
                platforms: linux/amd64,linux/arm64,linux/arm/v7
                push: true
                tags: ${{ steps.meta-engine.outputs.tags }}
                labels: ${{ steps.meta-engine.outputs.labels }}

            - name: Generate artifact attestation for acexy
              uses: actions/attest-build-provenance@v1
              with:
                subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                subject-digest: ${{ steps.push.outputs.digest }}
                push-to-registry: true

            - name: Generate artifact attestation for the engine
              uses: actions/attest-build-provenance@v1
              with:
                subject-name: ${{ env.GHCR_ENGINE_IMAGE }}
                subject-digest: ${{ steps.push-engine.outputs.digest }}
                push-to-registry: true

            - name: Update release information
              uses: irongut/EditRelease@v1.2.0
              with:
                token: ${{ secrets.GITHUB_TOKEN }}
                id: ${{ github.event.release.id }}
                body: |
                  `docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tags }}`
                  `docker pull ${{ env.GHCR_ENGINE_IMAGE }}:${{ steps.meta-engine.outputs.tags }}`
