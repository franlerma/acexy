services:
  acexy:
    image: fralermo/acexy:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acexy-orchestrator
    restart: unless-stopped
    ports:
      - "8080:8080/tcp"
    environment:
      # Acexy core config
      ACEXY_LISTEN_ADDR: ":8080"
      ACEXY_SCHEME: "http"
      ACEXY_M3U8_STREAM_TIMEOUT: "60s"
      ACEXY_M3U8: "false"
      ACEXY_EMPTY_TIMEOUT: "20s"
      ACEXY_BUFFER_SIZE: "4MB"
      ACEXY_NO_RESPONSE_TIMEOUT: "3s"
      ACEXY_LOG_LEVEL: "INFO"

      ACEXY_ACESTREAM_DNS_SERVERS: "1.1.1.1,8.8.8.8"

      # Orchestrator config
      ACESTREAM_MIN_REPLICAS: "1"
      ACESTREAM_MAX_REPLICAS: "5"
      ACESTREAM_STREAMS_PER_INSTANCE: "2"
      ACESTREAM_IDLE_TIMEOUT: "10s"
      ACESTREAM_RECYCLE_TIMEOUT: "15s"
      ACESTREAM_IMAGE: "wafy80/acestream:latest"

      # VPN routing: empty = regular bridge mode (AceStream instances on their
      # own IP:6878). Set to a container name (e.g. "warp") to route ALL
      # AceStream traffic through that container's network namespace. In VPN
      # mode each replica uses an internal port offset (6878, 6879, ...) because
      # they share the VPN namespace.
      # ACESTREAM_VPN_CONTAINER: "warp"

      # Docker socket proxy
      DOCKER_HOST: "tcp://docker-proxy:2375"
    networks:
      - acexy-orchestrator-network
    depends_on:
      docker-proxy:
        condition: service_started

  docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: docker-proxy
    privileged: true
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      DELETE: 1
      NETWORKS: 1
      VOLUMES: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - acexy-orchestrator-network
    restart: unless-stopped

  # VPN routing container (Cloudflare WARP). Only used when
  # ACESTREAM_VPN_CONTAINER=warp is set on the acexy service. AceStream
  # containers then share this container's network namespace, forcing all their
  # traffic (including P2P) out through WARP.
  #
  # IMPORTANT: namespace sharing requires the VPN container to actually route
  # traffic. For WARP you MUST enable NAT, otherwise AceStream traffic will NOT
  # go through the VPN:
  #   - set WARP_ENABLE_NAT=1
  #   - uncomment net.ipv4.ip_forward=1 below
  #     (and net.ipv6.conf.all.forwarding=1 + net.ipv6.conf.all.accept_ra=2 if IPv6)
  warp:
    image: caomingjun/warp
    container_name: warp
    restart: always
    # add removed rule back (https://github.com/opencontainers/runc/pull/3468)
    device_cgroup_rules:
      - 'c 10:200 rwm'
    ports:
      - "1080:1080"
    environment:
      - WARP_SLEEP=2
      # - WARP_LICENSE_KEY= # optional
      # - WARP_ENABLE_NAT=1 # REQUIRED for acexy namespace sharing
    cap_add:
      # Docker already have them, these are for podman users
      - MKNOD
      - AUDIT_WRITE
      # additional required cap for warp, both for podman and docker
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
      # uncomment for nat (REQUIRED for acexy namespace sharing)
      # - net.ipv4.ip_forward=1
      # - net.ipv6.conf.all.forwarding=1
      # - net.ipv6.conf.all.accept_ra=2
    volumes:
      - ./data:/var/lib/cloudflare-warp

networks:
  acexy-orchestrator-network:
    name: acexy-orchestrator-network
    driver: bridge
